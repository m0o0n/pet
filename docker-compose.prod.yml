services:
  api:
    image: ${ECR_REGISTRY}/pet-project-api:${IMAGE_TAG:-latest}
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: production
    restart: unless-stopped

  web:
    image: ${ECR_REGISTRY}/pet-project-web:${IMAGE_TAG:-latest}
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NODE_ENV: production
    restart: unless-stopped
