name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get runner public IP
        id: ip
        run: echo "addr=$(curl -sf https://checkip.amazonaws.com)" >> $GITHUB_OUTPUT

      - name: Allow runner IP in EC2 security group
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ vars.EC2_SG_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.addr }}/32

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        run: |
          docker build -f apps/api/Dockerfile \
            -t ${{ vars.ECR_REGISTRY }}/pet-project-api:latest \
            .
          docker push ${{ vars.ECR_REGISTRY }}/pet-project-api:latest

      - name: Build and push Web image
        run: |
          docker build -f apps/web/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=http://${{ vars.EC2_HOST }}:8080 \
            -t ${{ vars.ECR_REGISTRY }}/pet-project-web:latest \
            .
          docker push ${{ vars.ECR_REGISTRY }}/pet-project-web:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            ECR=${{ vars.ECR_REGISTRY }}
            aws ecr get-login-password --region eu-central-1 \
              | docker login --username AWS --password-stdin $ECR
            cd /opt/app
            docker compose pull
            docker run --rm --env-file .env \
              $ECR/pet-project-api:latest \
              bunx prisma migrate deploy
            docker compose up -d

      - name: Remove runner IP from EC2 security group
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ vars.EC2_SG_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.addr }}/32
