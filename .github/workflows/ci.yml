name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome check
        run: bunx biome ci .

      - name: Type check API
        run: cd apps/api && bunx tsc --noEmit -p tsconfig.build.json

      - name: Type check Web
        run: cd apps/web && bunx tsc --noEmit
